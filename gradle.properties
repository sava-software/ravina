org.gradle.configuration-cache=true
org.gradle.caching=true

# activate once it works more reliable in IntelliJ
# https://docs.gradle.org/current/userguide/isolated_projects.html
# org.gradle.unsafe.isolated-projects=true

# The dependency verification policy's declaration, which sava-build's verificationPolicy requires
# beside gradle/verification-metadata.xml from 21.8.0: Gradle's default while the file is present
# and nothing without it, so the line changes nothing for Gradle and declares the policy to the
# guard, which then fails check should the file go missing.
org.gradle.dependency.verification=strict
