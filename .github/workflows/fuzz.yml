name: Fuzz

on:
  schedule:
    # weekly soak; findings surface as workflow failures with the crash
    # input attached — commit each one as a named seed + regression test
    # (see the fuzz corpora under each module's src/test/resources/fuzz)
    - cron: "29 5 * * 1"
  workflow_dispatch:
    inputs:
      max-fuzz-time:
        description: Seconds to run each fuzz target.
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      # Integer ceiling in bash rather than expression math, which has no rounding
      # and would hand the runner a fraction whenever max-fuzz-time is not a
      # multiple of 60.
      - id: budget
        name: Compute fuzz time budget
        env:
          MAX_FUZZ_TIME: ${{ inputs.max-fuzz-time || '900' }}
        # the regex guard is load-bearing: bash arithmetic resolves alphabetic
        # garbage as an unset variable, silently budgeting 0 seconds of fuzzing
        run: |
          [[ "$MAX_FUZZ_TIME" =~ ^[1-9][0-9]*$ ]] || { echo "max-fuzz-time must be positive whole seconds, no leading zeros: '$MAX_FUZZ_TIME'" >&2; exit 1; }
          echo "timeout-minutes=$(( (8 * MAX_FUZZ_TIME + 59) / 60 + 30 ))" >> "$GITHUB_OUTPUT"

      - name: Fuzz
        # --continue: a crashing target must not skip the remaining targets — the
        # build still exits nonzero at the end, so the findings upload fires with
        # every target's results. The step-level timeout keeps a long
        # workflow_dispatch run from hitting the 360-minute job default, which
        # would cancel (not fail) the job and silently skip that upload.
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.timeout-minutes) }}
        run: >
          ./gradlew --stacktrace --continue
          -PjavaVersion=${{ steps.setup.outputs.java-version }}
          -PmaxFuzzTime=${{ inputs.max-fuzz-time || '900' }}
          :ravina-core:fuzzBackoff :ravina-core:fuzzCapacityConfig
          :ravina-core:fuzzCapacityState :ravina-core:fuzzConfigs
          :ravina-core:fuzzConfigParity
          :ravina-solana:fuzzConfigs :ravina-solana:fuzzConfigParity
          :ravina-kms-core:fuzzSigningConfig
        env:
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          # Jazzer writes crash-*/oom-*/timeout-* reproducers into the module
          # working directory; the working corpora hold the inputs that led there
          path: |
            ravina-core/crash-*
            ravina-core/oom-*
            ravina-core/timeout-*
            ravina-core/build/fuzz/
            ravina-solana/crash-*
            ravina-solana/oom-*
            ravina-solana/timeout-*
            ravina-solana/build/fuzz/
            ravina-kms/core/crash-*
            ravina-kms/core/oom-*
            ravina-kms/core/timeout-*
            ravina-kms/core/build/fuzz/
          if-no-files-found: ignore
