# JUL configuration for the soak client JVM. sava and ravina log through System.Logger, which
# the JDK routes to java.util.logging; this keeps the console at INFO with one line per record
# and leaves the JDK HTTP client's own chatter at WARNING.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL %4$s %3$s %5$s%6$s%n
jdk.internal.httpclient.level = WARNING
jdk.httpclient.level = WARNING
